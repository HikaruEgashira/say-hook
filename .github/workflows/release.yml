name: CI / Release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions: {}
jobs:
  test:
    strategy:
      matrix:
        os:
          - hikae-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 5
      - timeout-minutes: 5
        run: bun install --frozen-lockfile
      - timeout-minutes: 5
        run: bun test && bun run typecheck
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          # Bun cross-compiles the darwin binaries on the Linux runner, so the
          # macOS runner is gone without dropping the release artifacts.
          - os: hikae-2vcpu-ubuntu-2404-arm
            target: bun-darwin-arm64
            suffix: darwin-arm64
          - os: hikae-2vcpu-ubuntu-2404-arm
            target: bun-darwin-x64
            suffix: darwin-x64
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 5
      - timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Build
        timeout-minutes: 5
        env:
          BUILD_TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: bun build --compile --target="$BUILD_TARGET" --define __VERSION__="\"$REF_NAME\"" --outfile=say-hook index.ts
      - name: Archive
        timeout-minutes: 5
        env:
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: tar czf "say-hook-${REF_NAME}-${SUFFIX}.tar.gz" say-hook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: say-hook-${{ matrix.suffix }}
          path: say-hook-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 5
    runs-on: hikae-2vcpu-ubuntu-2404-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        timeout-minutes: 5
        with:
          files: "*.tar.gz"
